# Default values for stateful-blog.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -------------------------------------------------------------
# Blog Application Configuration
# -------------------------------------------------------------
blogApp:
  replicaCount: 2
  image:
    repository: batchlcwd/blog-app
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "256Mi"

# -------------------------------------------------------------
# Application Environment & Database Connection Configuration
# -------------------------------------------------------------
config:
  springProfilesActive: prod
  dbHost: mysql-service
  dbPort: "3306"
  dbName: blogdb

# -------------------------------------------------------------
# MySQL StatefulSet Configuration
# -------------------------------------------------------------
mysql:
  enabled: true
  replicas: 1
  serviceName: mysql-service
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  service:
    port: 3306
    targetPort: 3306
  auth:
    # Base64 encoded or plain text password
    rootPassword: "root123"
  persistence:
    accessMode: ReadWriteOnce
    size: 2Gi
    # storageClassName: standard # Uncomment and specify if using a specific StorageClass
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# -------------------------------------------------------------
# Ingress Controller Configuration
# -------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: blog.local
  path: /
  pathType: Prefix
