name: Easy Buy CI/CD

# Any change under easy_busy/ triggers a rollout:
# - pull_request: dry-run only (kubectl diff against the k8s manifests) - nothing is built or deployed.
# - push to main: rebuilds + pushes every service's Docker image, applies the k8s
#   manifests (idempotent even when unchanged), then restarts every Deployment so the
#   freshly-pushed :latest images actually get pulled - Kubernetes has no way to notice
#   a :latest tag's underlying image changed on its own, since the Deployment spec text
#   is identical either way.
#
# Prerequisites (see easy_busy/k8s/eks/EKS-DEPLOYMENT.md "CI/CD: Auto-Deploy on Push"):
#   - AWS_ROLE_ARN        - IAM role GitHub assumes via OIDC, scoped to the easybuy namespace.
#   - DOCKERHUB_USERNAME  - Docker Hub account that owns the batchlcwd/* images.
#   - DOCKERHUB_TOKEN     - Docker Hub access token (Account Settings -> Security), not your password.
on:
  push:
    branches: [main]
    paths:
      - "easy_busy/**"
  pull_request:
    branches: [main]
    paths:
      - "easy_busy/**"

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: substring-prod
  NAMESPACE: easybuy
  DOCKERHUB_NAMESPACE: batchlcwd
  MANIFESTS: >-
    01-namespace.yml
    02-instfastructure.yml
    03-config-map.yml
    05-spring-cloud-infra.yml
    06-easy-buy-microservices.yml
    07-ingress.yml
  SERVICES: >-
    service-discovery
    config-server
    api-gateway
    users-service
    products-service
    inventory-service
    cart-order-service
    payment-service
    notifications-service
    ai-service

permissions:
  id-token: write
  contents: read

concurrency:
  group: easy-busy-cicd
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Show what the manifests would change
        working-directory: easy_busy/k8s/eks
        run: |
          set -uo pipefail
          for f in $MANIFESTS; do
            echo "::group::diff $f"
            kubectl diff -f "$f" || true
            echo "::endgroup::"
          done

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install common-service (plain Maven dependency, not a reactor module -
          4 of the 10 services need it in the local repo to even compile)
        working-directory: easy_busy/common-service/common-service
        run: sh mvnw -q -B install -DskipTests

      - name: Build & push every service image
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            echo "::group::$svc"
            (cd "easy_busy/$svc/$svc" && sh mvnw -q -B clean compile jib:build -Dimage="$DOCKERHUB_NAMESPACE/$svc:latest")
            echo "::endgroup::"
          done

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply manifests (01 -> 07, in order)
        working-directory: easy_busy/k8s/eks
        run: |
          set -euo pipefail
          for f in $MANIFESTS; do
            echo "::group::apply $f"
            kubectl apply -f "$f"
            echo "::endgroup::"
          done

      - name: Roll the new images / config out to running pods
        # kubectl apply alone won't restart a pod whose Deployment spec text
        # didn't change (e.g. only the image behind a :latest tag changed, or
        # only a ConfigMap/Secret changed) - force every Deployment to restart
        # so it actually picks up what was just built/applied. StatefulSets
        # (mysql/kafka/postgres/redis) are deliberately left alone - restarting
        # databases shouldn't be an automatic side effect of an app code push.
        run: kubectl rollout restart deployment -n "$NAMESPACE"

      - name: Wait for rollouts to finish
        run: |
          set -euo pipefail
          for d in $SERVICES; do
            kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout=300s
          done

      - name: Summary
        if: always()
        run: kubectl get pods -n "$NAMESPACE" -o wide
