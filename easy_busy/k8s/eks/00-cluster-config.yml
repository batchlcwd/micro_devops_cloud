apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig


metadata:
  name: substring-prod
  region: ap-south-1
  version: "1.36"

iam:
  withOIDC: true


managedNodeGroups:
  - name: substring-prod
    instanceType: t3.large
    minSize: 1
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false
    iam:
      withAddonPolicies:
        ebs: true
        albIngress: true
        cloudWatch: true