#all microservices manifest

#api gateway deployment
#api gateway - service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: easybuy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: batchlcwd/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: CONFIG_SERVER_URL
            - name: EUREKA_DEFAULT_ZONE
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: EUREKA_DEFAULT_ZONE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: SPRING_DATA_REDIS_HOST
            - name: FRONTEND_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: FRONTEND_ORIGINS
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
---
# ClusterIP only: public access now goes through the Ingress in 07-ingress.yml
# (AWS Load Balancer Controller provisions an ALB from that resource).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: easybuy
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: api-gateway

---
#user service deployment
#user service - service
# prod config (easy_buy_config/USERS-SERVICE-prod.properties) listens on 8085 and needs
# SPRING_DATASOURCE_* injected explicitly (its default points at localhost/root123).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: easybuy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: batchlcwd/users-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: CONFIG_SERVER_URL
            - name: EUREKA_DEFAULT_ZONE
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: EUREKA_DEFAULT_ZONE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: easybuy-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easybuy-secrets
                  key: SPRING_DATASOURCE_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: easybuy
spec:
  ports:
    - port: 8085
  selector:
    app: users-service

