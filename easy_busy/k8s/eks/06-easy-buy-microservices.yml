metadata:
  name: products-service
  namespace: easybuy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: batchlcwd/products-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: CONFIG_SERVER_URL
            - name: EUREKA_DEFAULT_ZONE
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: EUREKA_DEFAULT_ZONE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: easybuy-config
                  key: SPRING_PROFILES_ACTIVE
            # ImageKit credentials now come from easy_buy_config (PRODUCT-SERVICE-prod.properties)
            # instead of this Secret. Left here, commented, in case that changes.
            # - name: IMAGEKIT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: easybuy-secrets
            #       key: IMAGEKIT_ID
            # - name: IMAGEKIT_PUBLIC_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: easybuy-secrets
            #       key: IMAGEKIT_PUBLIC_KEY
            # - name: IMAGEKIT_PRIVATE_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: easybuy-secrets
            #       key: IMAGEKIT_PRIVATE_KEY
            # - name: IMAGEKIT_URL_ENDPOINT
            #   valueFrom:
            #     secretKeyRef:
            #       name: easybuy-secrets
            #       key: IMAGEKIT_URL_ENDPOINT
            # - name: IMAGEKIT_FOLDER
            #   valueFrom:
            #     secretKeyRef:
            #       name: easybuy-secrets
            #       key: IMAGEKIT_FOLDER
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: easybuy
spec:
  ports:
    - port: 8081
  selector:
    app: products-service

