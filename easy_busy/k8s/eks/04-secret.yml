apiVersion: v1
kind: Secret
metadata:
  name: easybuy-secrets
  namespace: easybuy
type: Opaque
stringData:
  # MySQL root credentials (mysql StatefulSet + users-service).
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATASOURCE_PASSWORD: "securepassword"
  # Must match the literal (non-overridable) credentials hardcoded in
  # PRODUCT-SERVICE-prod.properties in the easy_buy_config repo.
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "user"
  # Razorpay credentials now come from easy_buy_config (PAYMENT-SERVICE-prod.properties)
  # instead of this Secret. Left here, commented, in case that changes.
  # RAZORPAY_KEY_ID: "rzp_test_3c1cR1Y1k1x1z1"
  # RAZORPAY_KEY_SECRET: "dummy_secret"
  # ImageKit credentials/URL likewise come from easy_buy_config (PRODUCT-SERVICE-prod.properties).
  # NOTE: unlike the keys above, imagekit.* is hardcoded there (no ${...} placeholder), so
  # Spring Cloud Config will NOT let these env vars override it unless that file is changed
  # to reference ${IMAGEKIT_...}. Left here, commented, in case that changes.
  # IMAGEKIT_ID: "batchlcwd"
  # IMAGEKIT_PUBLIC_KEY: "public_AksrYlt8twF6jRum4Ya+MbQcLCg="
  # IMAGEKIT_PRIVATE_KEY: "private_/V3EMSmNRaUXenhWj9E/PnnsKc8="
  # IMAGEKIT_URL_ENDPOINT: "https://ik.imagekit.io/batchlcwd"
  # IMAGEKIT_FOLDER: "/products_production"
