apiVersion: v1
kind: ConfigMap
metadata:
  name: easybuy-config
  namespace: easybuy
data:
  # Every key below overrides a remote-config default that is either absent
  # or points at localhost (wrong inside the cluster). Database URLs, Kafka
  # bootstrap servers, and service-name constants come from easy_buy_config
  # (github.com/batchlcwd/easy_buy_config) and are NOT duplicated here.
  SPRING_PROFILES_ACTIVE: "prod"
  EUREKA_DEFAULT_ZONE: "http://service-discovery:8761/eureka"
  CONFIG_SERVER_URL: "http://config-server:8079"
  SPRING_MAIL_HOST: "mailhog"
  SPRING_MAIL_PORT: "1025"
  SPRING_DATA_REDIS_HOST: "redis"
  # api-gateway CORS allow-list, comma-separated. Add your frontend's dev
  # server origin(s) here if it's not plain localhost:3000.
  FRONTEND_ORIGINS: "http://localhost:3000"
