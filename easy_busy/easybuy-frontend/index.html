<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>EasyBuy — Shop smarter</title>
    <meta name="description" content="EasyBuy – quality products, honest prices and fast delivery." />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white.
      // Keep the key in sync with src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('easybuy-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
