services:
  mysql:
    image: mysql:latest
    container_name: mysql_container_new
    restart: unless-stopped

    ports:
      - "3309:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: blog_app

    volumes:
      - mysql_data_new:/var/lib/mysql

    networks:
      - backend-network-new

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  blogapp:
    build: .
    container_name: springboot-blog-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
#      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: blog_app

    networks:
      - backend-network-new

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data_new:
    driver: local


networks:
  backend-network-new:
    driver: bridge
