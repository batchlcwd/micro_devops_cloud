server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  application:
    name: blog-app

  #  db configurations
  datasource:
    url: jdbc:mysql://localhost:3306/blog_app
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


#jwt related configurations
security:
  jwt:
    secret: 24tqfweqhfofjwfjhwfwoijdfqwbdpojfwfbhwfnwjhfdbijoqwhoqfbqifhqagrasgasgafasgadfweatesbsadgsdhbsagshag
    access-token-expire-time: 600000
    refresh-token-expire-time: 3600000
    issuer: substring-blog-app

#Dialect
#driver classname

logging:
  level:
    com.substring: DEBUG
    org.springframework.security: DEBUG


aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: ap-south-1
  bucket: blog-app-micro-devops